<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="hero">
        <h1 id="hero-title">Metric/Imperial Unit Converter</h1>
         <div id="number-input">
            <input type="number" id="number">
         </div>
            <button id="converter-btn">Convert</button>
         </div>
         <div id= "groupings">
            <div class="converting-groups">
                <h4 class="group-title">Length (Meter/Feet)</h4>
                <p id="length-input"></p>
            </div>
            <div class="converting-groups">
                <h4 class="group-title">Volume (Liters/Gallons)</h4>
                <p id="volume-input"></p>
            </div>
            <div class="converting-groups">
                <h4 class="group-title">Mass (Kilograms/Pounds)</h4>
                <p id="mass-input"></p>
            </div>
         </div>
        <script src="index.js"></script>
        </div>
    </body>
</html>
